name: WebGL Release

on:
  push:
    branches:
      - release/webgl
      - release/webgl-*
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      sourceRef:
        description: "Git ref to build, for example v3.0.1"
        required: false
        type: string
      version:
        description: "Version to show in game, for example 3.0.1"
        required: false
        type: string
      releaseTag:
        description: "GitHub Release tag, for example v3.0.1"
        required: false
        type: string

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: webgl-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build WebGL
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      is_release: ${{ steps.version.outputs.is_release }}
      release_tag: ${{ steps.version.outputs.release_tag }}
      source_sha: ${{ steps.source.outputs.sha }}
    steps:
      - name: Resolve version
        id: version
        shell: bash
        env:
          INPUT_SOURCE_REF: ${{ inputs.sourceRef }}
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_RELEASE_TAG: ${{ inputs.releaseTag }}
        run: |
          source_ref="${INPUT_SOURCE_REF}"
          version="${INPUT_VERSION}"
          release_tag="${INPUT_RELEASE_TAG}"
          is_release=false

          if [[ "${GITHUB_REF_TYPE}" == "tag" && "${GITHUB_REF_NAME}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            source_ref="${GITHUB_REF_NAME}"
            version="${GITHUB_REF_NAME#v}"
            release_tag="${GITHUB_REF_NAME}"
            is_release=true
          elif [[ -n "${source_ref}" ]]; then
            if [[ -z "${version}" && "${source_ref}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              version="${source_ref#v}"
            fi
            if [[ -z "${release_tag}" && "${version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              release_tag="v${version}"
            fi
            if [[ "${version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              is_release=true
            fi
          elif [[ "${GITHUB_REF_TYPE}" == "branch" && "${GITHUB_REF_NAME}" =~ ^release/webgl-([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
            version="${BASH_REMATCH[1]}"
            source_ref="v${version}"
            release_tag="v${version}"
            is_release=true
          else
            source_ref="${GITHUB_REF_NAME}"
            version="0.0.${GITHUB_RUN_NUMBER}"
          fi

          echo "source_ref=${source_ref}" >> "${GITHUB_OUTPUT}"
          echo "version=${version}" >> "${GITHUB_OUTPUT}"
          echo "release_tag=${release_tag}" >> "${GITHUB_OUTPUT}"
          echo "is_release=${is_release}" >> "${GITHUB_OUTPUT}"

      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.version.outputs.source_ref }}
          fetch-depth: 0
          lfs: true

      - name: Resolve source commit
        id: source
        shell: bash
        run: |
          echo "sha=$(git rev-parse HEAD)" >> "${GITHUB_OUTPUT}"

      - name: Cache Unity Library
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-WebGL-${{ hashFiles('Packages/manifest.json', 'Packages/packages-lock.json', 'ProjectSettings/ProjectVersion.txt') }}
          restore-keys: |
            Library-WebGL-
            Library-

      - name: Build Unity WebGL
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          unityVersion: 2022.3.62f1
          targetPlatform: WebGL
          buildName: WebGL
          buildsPath: Builds
          buildMethod: ArcitectureWebGLBuildCommand.Build
          customParameters: >
            -arcitectureVersion ${{ steps.version.outputs.version }}
            -arcitectureBuildNumber ${{ github.run_number }}
            -arcitectureGitSha ${{ steps.source.outputs.sha }}
            -arcitectureGitDescribe ${{ steps.version.outputs.release_tag || steps.version.outputs.source_ref }}

      - name: Fix build output ownership
        shell: bash
        run: |
          sudo chown -R "${USER}:${USER}" Builds

      - name: Prepare Pages files
        shell: bash
        run: |
          touch Builds/WebGL/.nojekyll

      - name: Package WebGL artifact
        shell: bash
        run: |
          cd Builds
          zip -r "../arcitecture-webgl-${{ steps.version.outputs.version }}.zip" WebGL

      - name: Upload downloadable artifact
        uses: actions/upload-artifact@v4
        with:
          name: arcitecture-webgl-${{ steps.version.outputs.version }}
          path: arcitecture-webgl-${{ steps.version.outputs.version }}.zip
          if-no-files-found: error
          retention-days: 14

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: Builds/WebGL

  deploy:
    name: Deploy GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  release:
    name: Create GitHub Release
    needs:
      - build
      - deploy
    if: needs.build.outputs.is_release == 'true'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ needs.build.outputs.release_tag }}
      VERSION: ${{ needs.build.outputs.version }}
      SOURCE_SHA: ${{ needs.build.outputs.source_sha }}
      PAGE_URL: ${{ needs.deploy.outputs.page_url }}
    steps:
      - name: Download WebGL artifact
        uses: actions/download-artifact@v4
        with:
          name: arcitecture-webgl-${{ env.VERSION }}

      - name: Write release notes
        shell: bash
        run: |
          cat > release-notes.md <<EOF
          Arcitecture WebGL 试玩版本。

          试玩地址：${PAGE_URL}
          版本：${VERSION}
          提交：${SOURCE_SHA}
          EOF

      - name: Publish release
        shell: bash
        run: |
          ASSET="arcitecture-webgl-${VERSION}.zip"
          if gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
            gh release upload "${RELEASE_TAG}" "${ASSET}" --clobber
            gh release edit "${RELEASE_TAG}" --title "Arcitecture ${RELEASE_TAG}" --notes-file release-notes.md
          else
            gh release create "${RELEASE_TAG}" "${ASSET}" --title "Arcitecture ${RELEASE_TAG}" --notes-file release-notes.md --verify-tag
          fi
