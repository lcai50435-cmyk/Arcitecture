name: WebGL Release

on:
  push:
    branches:
      - release/webgl
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: webgl-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build WebGL
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      is_release: ${{ steps.version.outputs.is_release }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      - name: Resolve version
        id: version
        shell: bash
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" && "${GITHUB_REF_NAME}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "${GITHUB_OUTPUT}"
            echo "is_release=true" >> "${GITHUB_OUTPUT}"
          else
            echo "version=0.0.${GITHUB_RUN_NUMBER}" >> "${GITHUB_OUTPUT}"
            echo "is_release=false" >> "${GITHUB_OUTPUT}"
          fi

      - name: Cache Unity Library
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-WebGL-${{ hashFiles('Packages/manifest.json', 'Packages/packages-lock.json', 'ProjectSettings/ProjectVersion.txt') }}
          restore-keys: |
            Library-WebGL-
            Library-

      - name: Build Unity WebGL
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          unityVersion: 2022.3.62f1
          targetPlatform: WebGL
          buildName: WebGL
          buildsPath: Builds
          buildMethod: ArcitectureWebGLBuildCommand.Build
          customParameters: >
            -arcitectureVersion ${{ steps.version.outputs.version }}
            -arcitectureBuildNumber ${{ github.run_number }}
            -arcitectureGitSha ${{ github.sha }}
            -arcitectureGitDescribe ${{ github.ref_name }}

      - name: Prepare Pages files
        id: prepare_pages
        shell: bash
        run: |
          sudo chown -R "$(id -u):$(id -g)" Builds
          pages_path="Builds/WebGL"
          if [[ ! -f "${pages_path}/index.html" && -f "${pages_path}/WebGL/index.html" ]]; then
            pages_path="${pages_path}/WebGL"
          fi
          if [[ ! -f "${pages_path}/index.html" ]]; then
            echo "WebGL index.html not found under Builds/WebGL" >&2
            find Builds -maxdepth 3 -type f | sort >&2
            exit 1
          fi
          touch "${pages_path}/.nojekyll"
          echo "path=${pages_path}" >> "${GITHUB_OUTPUT}"

      - name: Package WebGL artifact
        shell: bash
        run: |
          cd Builds
          zip -r "../arcitecture-webgl-${{ steps.version.outputs.version }}.zip" WebGL

      - name: Upload downloadable artifact
        uses: actions/upload-artifact@v4
        with:
          name: arcitecture-webgl-${{ steps.version.outputs.version }}
          path: arcitecture-webgl-${{ steps.version.outputs.version }}.zip
          if-no-files-found: error
          retention-days: 14

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ${{ steps.prepare_pages.outputs.path }}

  deploy:
    name: Deploy GitHub Pages
    needs: build
    if: github.ref_type != 'tag'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  release:
    name: Create GitHub Release
    needs: build
    if: needs.build.outputs.is_release == 'true'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ github.ref_name }}
      VERSION: ${{ needs.build.outputs.version }}
      PAGE_URL: https://lcai50435-cmyk.github.io/Arcitecture/
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download WebGL artifact
        uses: actions/download-artifact@v4
        with:
          name: arcitecture-webgl-${{ env.VERSION }}

      - name: Write release notes
        shell: bash
        run: |
          cat > release-notes.md <<EOF
          Arcitecture WebGL 试玩版本。

          试玩地址：${PAGE_URL}
          版本：${VERSION}
          提交：${GITHUB_SHA}
          EOF

      - name: Publish release
        shell: bash
        run: |
          ASSET="arcitecture-webgl-${VERSION}.zip"
          if gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
            gh release upload "${RELEASE_TAG}" "${ASSET}" --clobber
            gh release edit "${RELEASE_TAG}" --title "Arcitecture ${RELEASE_TAG}" --notes-file release-notes.md
          else
            gh release create "${RELEASE_TAG}" "${ASSET}" --title "Arcitecture ${RELEASE_TAG}" --notes-file release-notes.md --verify-tag
          fi
