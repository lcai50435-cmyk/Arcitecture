name: WebGL Release

on:
  push:
    branches:
      - master
      - main
      - release/webgl
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: Optional build version, for example 0.1.0
        required: false
        type: string

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: webgl-release-${{ github.ref }}
  cancel-in-progress: false

env:
  # GameCI has the public 2022.3.62f1 image; the local project was last opened with 2022.3.62f3c1.
  UNITY_VERSION: 2022.3.62f1
  BUILD_PATH: Builds
  BUILD_NAME: WebGL
  FALLBACK_PAGE_URL: https://lcai50435-cmyk.github.io/Arcitecture/

jobs:
  build:
    name: Build WebGL
    runs-on: ubuntu-latest
    timeout-minutes: 90
    outputs:
      version: ${{ steps.version.outputs.version }}
      is_release: ${{ steps.version.outputs.is_release }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          lfs: true

      - name: Resolve version
        id: version
        shell: bash
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" && "${GITHUB_REF_NAME}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            version="${GITHUB_REF_NAME#v}"
            echo "is_release=true" >> "${GITHUB_OUTPUT}"
          elif [[ -n "${REQUESTED_VERSION}" ]]; then
            version="${REQUESTED_VERSION#v}"
            echo "is_release=false" >> "${GITHUB_OUTPUT}"
          else
            version="0.0.${GITHUB_RUN_NUMBER}"
            echo "is_release=false" >> "${GITHUB_OUTPUT}"
          fi

          echo "version=${version}" >> "${GITHUB_OUTPUT}"

      - name: Cache Unity Library
        uses: actions/cache@v5
        with:
          path: Library
          key: Library-WebGL-${{ hashFiles('Packages/manifest.json', 'Packages/packages-lock.json', 'ProjectSettings/ProjectVersion.txt') }}
          restore-keys: |
            Library-WebGL-
            Library-

      - name: Build Unity WebGL
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
        with:
          unityVersion: ${{ env.UNITY_VERSION }}
          targetPlatform: WebGL
          buildName: ${{ env.BUILD_NAME }}
          buildsPath: ${{ env.BUILD_PATH }}
          buildMethod: ArcitectureWebGLBuildCommand.Build
          customParameters: >
            -arcitectureVersion ${{ steps.version.outputs.version }}
            -arcitectureBuildNumber ${{ github.run_number }}
            -arcitectureGitSha ${{ github.sha }}
            -arcitectureGitDescribe ${{ github.ref_name }}

      - name: Prepare Pages files
        shell: bash
        run: |
          sudo chown -R "$(id -u):$(id -g)" "${BUILD_PATH}"
          test -d "${BUILD_PATH}/${BUILD_NAME}"
          touch "${BUILD_PATH}/${BUILD_NAME}/.nojekyll"

      - name: Package WebGL artifact
        shell: bash
        run: |
          cd "${BUILD_PATH}"
          zip -r "../arcitecture-webgl-${{ steps.version.outputs.version }}.zip" "${BUILD_NAME}"

      - name: Upload downloadable artifact
        uses: actions/upload-artifact@v7
        with:
          name: arcitecture-webgl-${{ steps.version.outputs.version }}
          path: arcitecture-webgl-${{ steps.version.outputs.version }}.zip
          if-no-files-found: error
          retention-days: 14

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ${{ env.BUILD_PATH }}/${{ env.BUILD_NAME }}
          include-hidden-files: true

  deploy:
    name: Deploy GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

  release:
    name: Create GitHub Release
    needs:
      - build
      - deploy
    if: needs.build.outputs.is_release == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ github.ref_name }}
      VERSION: ${{ needs.build.outputs.version }}
      PAGE_URL: ${{ needs.deploy.outputs.page_url || env.FALLBACK_PAGE_URL }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Download WebGL artifact
        uses: actions/download-artifact@v8
        with:
          name: arcitecture-webgl-${{ env.VERSION }}

      - name: Write release notes
        shell: bash
        run: |
          cat > release-notes.md <<EOF
          Arcitecture WebGL 试玩版本。

          试玩地址：${PAGE_URL}
          版本：${VERSION}
          提交：${GITHUB_SHA}
          EOF

      - name: Publish release
        shell: bash
        run: |
          ASSET="arcitecture-webgl-${VERSION}.zip"
          if gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
            gh release upload "${RELEASE_TAG}" "${ASSET}" --clobber
            gh release edit "${RELEASE_TAG}" --title "Arcitecture ${RELEASE_TAG}" --notes-file release-notes.md
          else
            gh release create "${RELEASE_TAG}" "${ASSET}" --title "Arcitecture ${RELEASE_TAG}" --notes-file release-notes.md --verify-tag
          fi
