<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1100" viewBox="0 0 1600 1100" role="img" aria-labelledby="title desc">
  <title id="title">Arcitecture 当前基地功能布局图</title>
  <desc id="desc">根据 BaseHubBootstrapper 运行时生成逻辑绘制的基地俯视示意图，包含图鉴、精灵、关卡入口、玩家出生点、训练木桩和主要动线。</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#101815"/>
      <stop offset="100%" stop-color="#18221f"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1c2623"/>
      <stop offset="100%" stop-color="#131a18"/>
    </linearGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#365642"/>
      <stop offset="100%" stop-color="#243a2e"/>
    </linearGradient>
    <linearGradient id="gate" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#d3a35a"/>
      <stop offset="100%" stop-color="#7c4f24"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#000000" flood-opacity="0.34"/>
    </filter>
    <style>
      .title { font: 700 40px -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif; fill: #f3e7c8; }
      .subtitle { font: 400 18px -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif; fill: #b7c6bf; }
      .card-title { font: 700 24px -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif; fill: #f2d28a; }
      .card-body { font: 400 17px/1.65 -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif; fill: #dbe4de; }
      .note { font: 400 15px -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif; fill: #b9c8c2; }
      .map-label { font: 700 20px -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif; fill: #f8f1dd; }
      .map-sub { font: 400 14px -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif; fill: #d4dfd9; }
      .small { font: 400 13px -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif; fill: #acc0b6; }
      .pill { font: 700 13px -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif; fill: #0f1513; }
      .map-outline { fill: none; stroke: #8fb6a1; stroke-opacity: 0.35; stroke-width: 2; stroke-dasharray: 10 10; }
      .callout { fill: #111816; stroke: #475c52; stroke-width: 1.5; }
      .flow { fill: none; stroke: #f1d087; stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; opacity: 0.9; }
      .hint-line { fill: none; stroke: #8aa99a; stroke-width: 2; stroke-dasharray: 6 8; opacity: 0.7; }
    </style>
  </defs>

  <rect width="1600" height="1100" fill="url(#bg)"/>

  <text x="64" y="76" class="title">Arcitecture 当前基地功能布局图</text>
  <text x="64" y="110" class="subtitle">依据 BaseScene + BaseHubBootstrapper 运行时生成逻辑还原。这里画的是“现在代码里的基地”，不是概念草图。</text>

  <rect x="60" y="150" width="300" height="210" rx="18" fill="url(#panel)" stroke="#41574d" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="86" y="192" class="card-title">场景现状</text>
  <text x="86" y="228" class="card-body">
    <tspan x="86" dy="0">• BaseScene 里当前只有一个</tspan>
    <tspan x="86" dy="28">  BaseHubBootstrapper 根对象。</tspan>
    <tspan x="86" dy="28">• 地面、装饰、玩家、交互点、UI</tspan>
    <tspan x="86" dy="28">  都在运行时动态生成。</tspan>
    <tspan x="86" dy="28">• 基地地板尺寸：14 x 9 世界单位。</tspan>
  </text>

  <rect x="60" y="388" width="300" height="266" rx="18" fill="url(#panel)" stroke="#41574d" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="86" y="430" class="card-title">关键规则</text>
  <text x="86" y="466" class="card-body">
    <tspan x="86" dy="0">• 基地内默认安全区，倒计时暂停。</tspan>
    <tspan x="86" dy="28">• 靠近交互点时显示 F 提示。</tspan>
    <tspan x="86" dy="28">• 打开图鉴或精灵面板时：</tspan>
    <tspan x="86" dy="28">  玩家移动、交互、攻击会被锁住。</tspan>
    <tspan x="86" dy="28">• 基地攻击默认关闭；木桩主要用于</tspan>
    <tspan x="86" dy="28">  临时调试攻击手感。</tspan>
    <tspan x="86" dy="28">• 进入关卡后前往 GameScene，返回时</tspan>
    <tspan x="86" dy="28">  会先提交背包进度再回基地。</tspan>
  </text>

  <g filter="url(#shadow)">
    <rect x="220" y="170" width="840" height="760" rx="30" fill="#17211d" stroke="#50685d" stroke-width="1.5"/>
    <text x="250" y="212" class="card-title">基地平面</text>
    <text x="250" y="240" class="note">俯视示意，中心坐标约为 (0, 0)</text>

    <rect x="240" y="280" width="840" height="540" rx="26" fill="url(#floor)" stroke="#7ba08a" stroke-width="2.2"/>
    <rect x="256" y="296" width="808" height="508" rx="20" class="map-outline"/>

    <text x="660" y="314" text-anchor="middle" class="small">安全区 / 基地地板（14 x 9u）</text>

    <rect x="609" y="346" width="102" height="312" rx="20" fill="#6a553b" opacity="0.96"/>
    <rect x="468" y="445" width="384" height="66" rx="20" fill="#6a553b" opacity="0.96"/>
    <text x="660" y="686" text-anchor="middle" class="small">主路径</text>

    <rect x="474" y="457" width="108" height="72" rx="18" fill="#2a5b36" stroke="#5ca06a" stroke-width="2"/>
    <rect x="738" y="457" width="108" height="72" rx="18" fill="#4fb6b8" fill-opacity="0.4" stroke="#86dde0" stroke-width="2"/>
    <text x="528" y="547" text-anchor="middle" class="small">阅读区</text>
    <text x="792" y="547" text-anchor="middle" class="small">精灵区</text>

    <rect x="575" y="372" width="20" height="51" rx="5" fill="#8a8b80"/>
    <rect x="725" y="372" width="20" height="51" rx="5" fill="#8a8b80"/>

    <g transform="translate(528 478)">
      <circle r="63" fill="none" stroke="#f0d48d" stroke-width="2" stroke-dasharray="8 8" opacity="0.6"/>
      <rect x="-32" y="-22" width="64" height="44" rx="4" fill="#6d2e1b" stroke="#f4d18e" stroke-width="2"/>
      <rect x="-24" y="-14" width="20" height="28" rx="3" fill="#f0c88c"/>
      <rect x="4" y="-14" width="20" height="28" rx="3" fill="#f0c88c"/>
      <rect x="-2" y="-18" width="4" height="36" rx="2" fill="#1f120d"/>
      <text x="0" y="70" text-anchor="middle" class="map-label">图鉴</text>
      <text x="0" y="92" text-anchor="middle" class="map-sub">打开建筑图鉴 / 解锁信息</text>
    </g>

    <g transform="translate(792 478)">
      <circle r="63" fill="none" stroke="#9de4e8" stroke-width="2" stroke-dasharray="8 8" opacity="0.6"/>
      <path d="M -18 16 C -26 -2 -20 -28 0 -36 C 20 -28 26 -2 18 16 C 10 28 -10 28 -18 16 Z" fill="#7ad1f4" stroke="#d6f7ff" stroke-width="2"/>
      <circle cx="-6" cy="-6" r="3" fill="#0d1011"/>
      <circle cx="6" cy="-6" r="3" fill="#0d1011"/>
      <text x="0" y="70" text-anchor="middle" class="map-label">精灵</text>
      <text x="0" y="92" text-anchor="middle" class="map-sub">属性面板 / 武器切换</text>
    </g>

    <g transform="translate(660 376)">
      <rect x="-42" y="-34" width="18" height="62" rx="5" fill="#8d5629"/>
      <rect x="24" y="-34" width="18" height="62" rx="5" fill="#8d5629"/>
      <rect x="-30" y="-44" width="60" height="18" rx="4" fill="#935f31"/>
      <rect x="-44" y="-58" width="88" height="16" rx="4" fill="#d5a35d"/>
      <rect x="-14" y="-8" width="28" height="20" rx="4" fill="#1e120b"/>
      <rect x="-42" y="-36" width="84" height="72" rx="12" fill="none" stroke="#efcf92" stroke-width="2" stroke-dasharray="8 8" opacity="0.55"/>
      <text x="0" y="-78" text-anchor="middle" class="map-label">关卡入口</text>
      <text x="0" y="-56" text-anchor="middle" class="map-sub">进入 GameScene</text>
    </g>

    <g transform="translate(660 622)">
      <circle r="28" fill="#d9a260" stroke="#f8ddb0" stroke-width="2"/>
      <rect x="-18" y="-4" width="36" height="34" rx="10" fill="#6b4027"/>
      <rect x="-10" y="-28" width="20" height="20" rx="10" fill="#d5a070"/>
      <circle cx="-5" cy="-23" r="2.3" fill="#121312"/>
      <circle cx="5" cy="-23" r="2.3" fill="#121312"/>
      <text x="0" y="60" text-anchor="middle" class="map-label">玩家出生点</text>
      <text x="0" y="82" text-anchor="middle" class="map-sub">初始朝基地上方动线推进</text>
    </g>

    <g transform="translate(402 634)">
      <rect x="-12" y="-42" width="24" height="84" rx="5" fill="#8b5c2d"/>
      <rect x="-26" y="-10" width="52" height="24" rx="5" fill="#8b5c2d"/>
      <rect x="-30" y="-12" width="60" height="28" rx="8" fill="none" stroke="#ecc88c" stroke-width="2" stroke-dasharray="8 8" opacity="0.55"/>
      <text x="0" y="62" text-anchor="middle" class="map-label">木桩</text>
      <text x="0" y="84" text-anchor="middle" class="map-sub">左侧训练位</text>
    </g>

    <g transform="translate(918 634)">
      <rect x="-12" y="-42" width="24" height="84" rx="5" fill="#8b5c2d"/>
      <rect x="-26" y="-10" width="52" height="24" rx="5" fill="#8b5c2d"/>
      <rect x="-30" y="-12" width="60" height="28" rx="8" fill="none" stroke="#ecc88c" stroke-width="2" stroke-dasharray="8 8" opacity="0.55"/>
      <text x="0" y="62" text-anchor="middle" class="map-label">木桩</text>
      <text x="0" y="84" text-anchor="middle" class="map-sub">右侧训练位</text>
    </g>

    <path class="flow" d="M 660 590 L 660 435"/>
    <path class="flow" d="M 640 486 L 570 486"/>
    <path class="flow" d="M 680 486 L 750 486"/>
    <path class="hint-line" d="M 462 634 L 600 634"/>
    <path class="hint-line" d="M 720 634 L 858 634"/>
  </g>

  <rect x="1100" y="150" width="430" height="248" rx="18" fill="url(#panel)" stroke="#41574d" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="1128" y="192" class="card-title">交互点职责</text>
  <text x="1128" y="228" class="card-body">
    <tspan x="1128" dy="0">图鉴：</tspan>
    <tspan x="1194" dy="0">查看建筑录、结构材料和解锁进度。</tspan>
    <tspan x="1128" dy="30">精灵：</tspan>
    <tspan x="1194" dy="0">打开“属性 / 武器”双页面板。</tspan>
    <tspan x="1128" dy="30">关卡入口：</tspan>
    <tspan x="1212" dy="0">离开基地进入探索场景。</tspan>
    <tspan x="1128" dy="30">木桩：</tspan>
    <tspan x="1194" dy="0">基地攻击开启后可测试近战 / 远程。</tspan>
    <tspan x="1128" dy="30">玩家：</tspan>
    <tspan x="1194" dy="0">出生在底部中央，向上接主路径。</tspan>
  </text>

  <rect x="1100" y="428" width="430" height="226" rx="18" fill="url(#panel)" stroke="#41574d" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="1128" y="470" class="card-title">面板内容</text>
  <text x="1128" y="506" class="card-body">
    <tspan x="1128" dy="0">精灵面板包含两页：</tspan>
    <tspan x="1128" dy="30">• 属性页：生命、生命上限、耐久、攻击、</tspan>
    <tspan x="1128" dy="28">  移动速度、防御。</tspan>
    <tspan x="1128" dy="30">• 武器页：近战、远程、特殊三档切换。</tspan>
    <tspan x="1128" dy="30">打开任一面板都会锁定玩家状态，</tspan>
    <tspan x="1128" dy="28">防止移动和误攻击。</tspan>
  </text>

  <rect x="1100" y="684" width="430" height="246" rx="18" fill="url(#panel)" stroke="#41574d" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="1128" y="726" class="card-title">探索闭环</text>
  <text x="1128" y="762" class="card-body">
    <tspan x="1128" dy="0">1. 从基地出生点出发。</tspan>
    <tspan x="1128" dy="30">2. 左拐看图鉴，右拐找精灵，向上进关卡。</tspan>
    <tspan x="1128" dy="30">3. 在 GameScene 收集内容并战斗。</tspan>
    <tspan x="1128" dy="30">4. 返回基地前先提交背包进度。</tspan>
    <tspan x="1128" dy="30">5. 回来继续看图鉴、调属性、换武器。</tspan>
    <tspan x="1128" dy="30">6. 重复“搜、打、撤、养成”的循环。</tspan>
  </text>

  <g transform="translate(72 1000)">
    <rect x="0" y="0" width="1456" height="56" rx="14" fill="#111816" stroke="#40554c" stroke-width="1.2"/>
    <text x="28" y="35" class="note">坐标锚点：图鉴 (-2.2, 1.2) ｜ 精灵 (2.2, 1.2) ｜ 关卡入口 (0, 2.9) ｜ 玩家 (0, -1.2) ｜ 木桩 (-4.3, -1.4) / (4.3, -1.4)</text>
  </g>
</svg>
